[/Script/Engine.RendererSettings]
; The 3D war table: Lumen light and reflections, cascaded shadow maps, TSR.
; Virtual shadow maps need Shader Model 6 and Windows targets SM5 (the engine default), so they never
; ran: every look and measurement of the table is with cascaded shadows. Off, so the editor stops
; warning "Missing Project Settings". Turning them on means adding PCD3D_SM6 and measuring again.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkyAtmosphere=True
; Cover both the miniature table and the yard's daylight EV13 without clipping cached light.
r.EyeAdaptation.CachedLightingPreExposure=8

[SystemSettings]
; TSR's history at the output size, not twice it (Epic scalability's 200 %). Measured at 1080p on an
; RTX 4050 laptop: TSR 3.0 -> 1.9 ms, the frame 6.6 -> 5.5 ms of GPU, the picture the same
; (mean difference 0.6/255). [SystemSettings] outranks the scalability groups.
r.TSR.History.ScreenPercentage=100
