[/Script/Engine.UserInterfaceSettings]
; UI scale by the shorter side (docs/CATNIGHT_UI_PLAN.md §4.3: 1.0 at 1080p, 0.8 near 800p, 1.33 at
; 1440p, 2.0 at 2160p). The engine's default curve shrinks a 720p window to two-thirds, which makes
; the text too small to read; this one stops at 0.8 there.
